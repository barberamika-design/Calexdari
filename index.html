/* ——— amagar scrollbar a tot arreu, però mantenir scroll tàctil ——— */

*, *::before, *::after {
  scrollbar-width: none !important;

*::-webkit-scrollbar,
*::before::-webkit-scrollbar,

}

  display: none;

  height: 0;

/* contenidors amb scroll del calendari i modals */

.phone-frame,
.phone-frame > div,

div[class*="overflow-y-scroll"],
.fixed.inset-0 {
  scrollbar-width: none !important;

@keyframes dayPop {
  0% {
    transform: scale(1);
  }

  40% {
    transform: scale(1.08);
  }

  70% {
    transform: scale(1.15);
  }

  100% {
    transform: scale(1);
  }
}

.day-animate {
  animation: dayPop 320ms cubic-bezier(0.34,1.56,0.64,1);
  z-index:10;
  border-color: white !important;
  box-shadow: 0 0 0 1px white, 0 8px 24px rgba(0,0,0,0.5);
}

/* Phone frame exact ratio 19.5:9 = 390x845 vertical, 845x390 horizontal */

.phone-frame {
  width: min(390px, calc(100vw - 16px));
  aspect-ratio: 9 / 19.5;
  max-height: calc(100dvh - var(--safe-area-inset-top) - 24px);
  background: #0a0a0a;
  border: 1px solid #1f1f1f;
  border-radius: 36px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 0 1px #1a1a1a, 0 24px 80px rgba(0,0,0,0.7);
  transition: width 0.55s cubic-bezier(0.4,0,0.2,1), aspect-ratio 0.55s cubic-bezier(0.4,0,0.2,1), border-radius 0.55s;
}

@media (orientation: landscape) {
  .phone-frame {
    width: min(845px, calc(100vw - 16px));
    aspect-ratio: 19.5 / 9;
    max-height: calc(100dvh - var(--safe-area-inset-top) - 24px);
    border-radius: 28px;
  }

  .phone-frame .calendar-grid-cell {
    min-height: 56px !important;
  }
}

/* For very narrow viewports keep ratio via scaling */

@media (max-width: 390px) {
  .phone-frame {
    border-radius: 0;
    border-left: none;
    border-right: none;
  }
}
