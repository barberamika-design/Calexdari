<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calendari Complet</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ===== LINIA 15-35: COLORS I FONT - TOCA AQUÍ PER CANVIAR ESTIL ===== */
:root {
  --bg: #0a0a0a;
  --cell: #1e1e1e;
  --border: #2a2a2a;
  --accent: #ff1744;
  --yellow-day: #eab308;
  --green-day: #22c55e;
}
* { font-family: 'Syne', sans-serif; font-weight: 700; box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:white; overflow-x:hidden; }
body { -webkit-overflow-scrolling: touch; }

/* ===== LINIA 35-45: SENSE BARRA DE SCROLL - NO TOCAR ===== */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display:none; width:0; height:0; }
#calendar-grid { overflow-y:auto; overscroll-behavior: contain; }

/* HEADER */
.header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
.cats { display:flex; gap:8px; flex-wrap:wrap; }
.cat-pill { padding:4px 10px; border-radius:20px; font-size:11px; color:white; border:1px solid var(--border); }
.month-nav { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; text-transform:capitalize; }
.month-nav button { background:#1e1e1e; border:1px solid var(--border); color:white; width:32px; height:32px; border-radius:50%; cursor:pointer; }

/* GRID */
.weekdays { display:grid; grid-template-columns:repeat(7,1fr); padding:8px 8px 4px; font-size:10px; opacity:0.4; text-transform:uppercase; letter-spacing:0.1em; }
.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); }
.day { background:var(--cell); min-height:90px; padding:6px; cursor:pointer; transition:transform 0.15s; position:relative; }
.day:active { transform:scale(0.97); }
.day.selected { transform:scale(1.06); z-index:5; border:1px solid var(--accent); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
.day-num { font-size:13px; font-weight:800; color:var(--yellow-day); } /* LINIA 60: groc per defecte */
.day-num.festiu { color:var(--green-day) !important; } /* LINIA 61: verd si festiu */
.day.festiu-bg { background: rgba(34,197,94,0.08); }
.notes { margin-top:4px; display:flex; flex-direction:column; gap:3px; }
.note { font-size:11px; line-height:1.25; padding:3px 6px; border-radius:7px; border:1px solid #333; background:#2a2a2a; overflow-wrap:anywhere; }
.note-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:middle; }

/* MODAL */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(8px); display:none; z-index:100; padding:16px; overflow-y:auto; }
.modal-bg.open { display:flex; align-items:center; justify-content:center; }
.modal { background:#141414; border:1px solid var(--border); border-radius:18px; width:100%; max-width:380px; overflow:hidden; }
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border); }
.modal-body { padding:18px; display:flex; flex-direction:column; gap:14px; }
.label { font-size:10px; text-transform:uppercase; letter-spacing:0.12em; opacity:0.35; }
input, textarea { width:100%; background:#1e1e1e; border:1px solid var(--border); color:white; border-radius:10px; padding:10px 12px; font-size:13px; outline:none; }
input:focus, textarea:focus { border-color:rgba(255,255,255,0.2); }
textarea { min-height:84px; resize:vertical; caret-color:white; }
.colors { display:flex; flex-wrap:wrap; gap:8px; }
.color-btn { width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:all 0.15s; }
.color-btn.sel { border-color:white; transform:scale(1.15); }
.event-row { display:flex; justify-content:space-between; align-items:center; background:#1e1e1e; border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
.btns { display:flex; justify-content:flex-end; gap:8px; }
.btn { height:36px; border-radius:20px; padding:0 18px; font-size:12px; font-weight:800; cursor:pointer; border:1px solid var(--border); }
.btn-cancel { background:transparent; color:white; opacity:0.7; }
.btn-save { background:white; color:black; border-color:white; }
.btn-del { background:#241316; border-color:#3a1a1e; color:#ff7a8e; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

/* FESTIU RANGE */
.festiu-box { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.25); border-radius:12px; padding:10px; }
</style>
</head>
<body>

<!-- HEADER: categories esquerra, mes dreta -->
<div class="header">
  <div id="cats" class="cats"></div> <!-- LINIA 105: aquí es pinten les categories creades -->
  <div class="month-nav">
    <button onclick="changeMonth(-1)"><</button>
    <span id="monthLabel"></span>
    <button onclick="changeMonth(1)">></button>
  </div>
</div>

<div class="weekdays"><div>Dl</div><div>Dt</div><div>Dc</div><div>Dj</div><div>Dv</div><div>Ds</div><div>Dg</div></div>
<div id="calendar-grid" class="grid"></div>

<!-- MODAL NOVA NOTA -->
<div id="modal" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span id="modalDate" style="font-size:12px"></span>
      <button onclick="closeModal()" style="background:rgba(255,255,255,0.05); border:0; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer">✕</button>
    </div>
    <div class="modal-body">
      <div id="existingEvents"></div>

      <label><div class="label">categoria</div>
        <input id="catInput" type="text" placeholder="cau, familia..."> <!-- LINIA 135: escriu categoria lliure -->
      </label>

      <div><div class="label">color</div>
        <div id="colorPicker" class="colors"></div> <!-- LINIA 139: 12 colors diferents -->
      </div>

      <div id="festiuRange" style="display:none">
        <div class="festiu-box">
          <label><div class="label" style="color:#86efac">De quin dia</div><input id="festiuStart" type="date"></label>
          <label><div class="label" style="color:#86efac">Quin dia</div><input id="festiuEnd" type="date"></label>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
        <label><div class="label">data</div><input id="dateInput" type="date"></label>
        <label><div class="label">hora</div><input id="timeInput" type="time"></label>
      </div>

      <label><div class="label">text</div>
        <textarea id="textInput" placeholder=""></textarea> <!-- LINIA 155: només cursor pampallugues, sense exemple -->
      </label>

      <div class="btns">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel·lar</button>
        <button class="btn btn-save" onclick="saveNote()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== LINIA 165-175: 12 COLORS BEN DIFERENTS - TOCA AQUÍ PER CANVIAR COLORS ===== */
const COLORS = ["#FF1744","#00B0FF","#00E676","#FFEA00","#D500F9","#FF9100","#00E5FF","#76FF03","#FF3D00","#651FFF","#F50057","#18FFFF"];

/* ===== LINIA 178-195: ON GUARDA LOCALMENT - TOCA AQUÍ PER CANVIAR EMMAGATZEMATGE ===== */
function loadNotes(){ return JSON.parse(localStorage.getItem('calendar_notes')||'[]'); }
function saveNotes(notes){ localStorage.setItem('calendar_notes', JSON.stringify(notes)); } // LINIA 180: guarda notes
function loadCats(){ return JSON.parse(localStorage.getItem('calendar_categories')||'[]'); }
function saveCats(cats){ localStorage.setItem('calendar_categories', JSON.stringify(cats)); } // LINIA 182: guarda categories
function loadFestius(){ return JSON.parse(localStorage.getItem('festius_ranges')||'[]'); }
function saveFestius(r){ localStorage.setItem('festius_ranges', JSON.stringify(r)); }

let currentDate = new Date();
let selectedDate = null;
let selectedColor = COLORS[0];
let selectedCat = '';

const monthNames = ["Gener","Febrer","Març","Abril","Maig","Juny","Juliol","Agost","Setembre","Octubre","Novembre","Desembre"];

function isFestiuDay(iso){
  return loadFestius().some(f=> iso>=f.start && iso<=f.end);
}

function changeMonth(d){
  currentDate.setMonth(currentDate.getMonth()+d);
  render();
}

function render(){
  const year=currentDate.getFullYear(), month=currentDate.getMonth();
  document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`; // LINIA 210: només mes i número any

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  let startDay = (firstDay.getDay()+6)%7; // dilluns=0
  const notes = loadNotes();
  const grid = document.getElementById('calendar-grid');
  grid.innerHTML='';

  // buits inici
  for(let i=0;i<startDay;i++){ const d=document.createElement('div'); d.className='day'; d.style.visibility='hidden'; grid.appendChild(d); }

  for(let day=1; day<=lastDay.getDate(); day++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayNotes = notes.filter(n=> n.date===iso || (n.festiu && iso>=n.festiuStart && iso<=n.festiuEnd));
    const cats = loadCats();

    const cell = document.createElement('div');
    cell.className='day';
    if(isFestiuDay(iso)) cell.classList.add('festiu-bg');
    if(selectedDate===iso) cell.classList.add('selected');
    cell.onclick=()=>openModal(iso);

    const num = document.createElement('div');
    num.className='day-num' + (isFestiuDay(iso)?' festiu':''); // groc per defecte, verd si festiu
    num.textContent=day;
    cell.appendChild(num);

    const notesDiv = document.createElement('div');
    notesDiv.className='notes';
    dayNotes.forEach(n=>{
      const cat = cats.find(c=>c.name.toLowerCase()===n.category.toLowerCase());
      const col = cat?cat.color:n.color||COLORS[0];
      const el = document.createElement('div');
      el.className='note';
      el.style.borderColor = col+'55';
      el.innerHTML=`<span class="note-dot" style="background:${col}"></span>${n.time?`<span style="opacity:0.6;font-size:10px">${n.time} </span>`:''}${n.text}`;
      notesDiv.appendChild(el);
    });
    cell.appendChild(notesDiv);
    grid.appendChild(cell);
  }
  renderCats();
}

function renderCats(){
  const cats = loadCats();
  const cont = document.getElementById('cats');
  cont.innerHTML='';
  cats.forEach(c=>{
    const p=document.createElement('div');
    p.className='cat-pill';
    p.style.background=c.color;
    p.style.color='white';
    p.textContent=c.name;
    cont.appendChild(p);
  });
}

function renderColorPicker(){
  const cont=document.getElementById('colorPicker');
  cont.innerHTML='';
  COLORS.forEach(col=>{
    const b=document.createElement('button');
    b.className='color-btn'+(selectedColor===col?' sel':'');
    b.style.background=col;
    b.onclick=()=>{ selectedColor=col; renderColorPicker(); };
    cont.appendChild(b);
  });
}

function openModal(iso){
  selectedDate=iso;
  document.getElementById('modalDate').textContent=iso;
  document.getElementById('dateInput').value=iso;
  document.getElementById('textInput').value='';
  document.getElementById('timeInput').value='';
  document.getElementById('catInput').value='';
  document.getElementById('festiuStart').value=iso;
  document.getElementById('festiuEnd').value=iso;
  selectedColor=COLORS[0];
  renderColorPicker();
  checkFestiu();

  // mostrar esdeveniments existents amb opció esborrar
  const notes=loadNotes().filter(n=> n.date===iso || (n.festiu && iso>=n.festiuStart && iso<=n.festiuEnd));
  const ex=document.getElementById('existingEvents');
  ex.innerHTML='';
  if(notes.length){
    const title=document.createElement('div'); title.className='label'; title.textContent='Esdeveniments del dia'; ex.appendChild(title);
    notes.forEach(n=>{
      const row=document.createElement('div'); row.className='event-row';
      row.innerHTML=`<div style="font-size:12px"><span style="color:${n.color}">●</span> ${n.category} - ${n.text}</div>`;
      const del=document.createElement('button'); del.className='btn-del'; del.textContent='✕';
      del.onclick=()=>{ deleteNote(n.id); };
      row.appendChild(del);
      ex.appendChild(row);
    });
  }

  document.getElementById('modal').classList.add('open');
  document.getElementById('textInput').focus();
  render();
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); selectedDate=null; render(); }

function checkFestiu(){
  const cat=document.getElementById('catInput').value.toLowerCase();
  const isFest=cat.includes('festiu')||cat.includes('festa');
  document.getElementById('festiuRange').style.display=isFest?'block':'none';
}
document.getElementById('catInput').addEventListener('input', checkFestiu);

function saveNote(){
  const text=document.getElementById('textInput').value.trim();
  const cat=document.getElementById('catInput').value.trim();
  const date=document.getElementById('dateInput').value;
  const time=document.getElementById('timeInput').value;
  if(!text||!cat||!date) return;

  const cats=loadCats();
  let existing=cats.find(c=>c.name.toLowerCase()===cat.toLowerCase());
  if(!existing){ existing={name:cat, color:selectedColor}; cats.push(existing); saveCats(cats); }
  else { existing.color=selectedColor; saveCats(cats); }

  const notes=loadNotes();
  const isFest=cat.toLowerCase().includes('festiu')||cat.toLowerCase().includes('festa');
  const newNote={
    id:Date.now().toString(),
    date:date,
    text:text,
    time:time,
    category:cat,
    color:selectedColor,
    festiu:isFest,
    festiuStart:isFest?document.getElementById('festiuStart').value:null,
    festiuEnd:isFest?document.getElementById('festiuEnd').value:null
  };
  notes.push(newNote);

  if(isFest){
    const festius=loadFestius();
    festius.push({start:newNote.festiuStart, end:newNote.festiuEnd});
    saveFestius(festius);
  }

  saveNotes(notes);
  closeModal();
}

function deleteNote(id){
  let notes=loadNotes();
  notes=notes.filter(n=>n.id!==id);
  saveNotes(notes);
  // recalcular festius
  const festius=[];
  notes.filter(n=>n.festiu).forEach(n=>festius.push({start:n.festiuStart, end:n.festiuEnd}));
  saveFestius(festius);
  if(selectedDate) openModal(selectedDate);
  else render();
}

render();
renderColorPicker();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
